[tools]
# ==========================================
# Module: base (Foundation Runtimes)
# ==========================================
node = "lts"
uv = "latest"
python = "latest"
bun = "latest"
usage = "latest"

# ==========================================
# Module: core (Universal CLI Utilities)
# ==========================================
fzf = "latest"
ripgrep = "latest"
lazygit = "latest"
fastfetch = "latest"
starship = "latest"
gh = "latest"
tlrc = "latest"
hunk = "latest"
"github:pamburus/hl" = "latest"

# ==========================================
# Subsystems
# ==========================================
# Module: nvim
neovim = "stable"

# Module: tmux
tmux = "latest"

# Module: fnox
fnox = { version = "latest", workflow = "release.yml" }

# Module: agents
claude = "latest"
opencode = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"

[settings]
trusted_config_paths = ["~/dev"]
github_attestations = false

# Support .python-version, .nvmrc, and .node-version files for older projects
legacy_version_file = true

# 'create' ensures a .venv exists; 'source' activates it upon entering the directory.
python.uv_venv_auto = "create|source"

# Optimization: Download precompiled Python binaries instead of building from source
python.compile = false

[env]
# Enable Poetry auto-activation (requires mise-poetry plugin)
MISE_POETRY_VENV_AUTO = "1"
MISE_POETRY_AUTO_INSTALL = "1"
