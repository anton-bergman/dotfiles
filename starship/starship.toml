"$schema" = 'https://starship.rs/config-schema.json'

# Single-line layout matching Oh-My-Posh my-theme.yaml
format = """$python$directory$git_branch$git_status$character"""
right_format = """$cmd_duration"""

add_newline = false
continuation_prompt = "[❯❯ ](white)"

[fill]
symbol = " "

[python]
format = '([(\(${virtualenv}\) )](bright-yellow))'
detect_extensions = []
detect_files = []
detect_folders = []

[directory]
style = "bright-purple"
repo_root_style = "bright-purple"
format = "[$path]($style)"
repo_root_format = "[$before_root_path]($style)[$repo_root]($repo_root_style)[$path]($style)"
truncation_length = 0
truncate_to_repo = false

[git_branch]
format = ' [git:\(](bright-green)[$branch](bright-yellow)'

[git_status]
format = '([ $all_status$ahead_behind](bright-yellow))[\)](bright-green)'
ahead = '󰁝'
behind = '󰁅'
diverged = '󰁅󰁝'
conflicted = '!'
modified = '*'
staged = '+'
untracked = '?'
deleted = '-'

[cmd_duration]
min_time = 5_000
format = "[$duration](yellow)"

[character]
format = "$symbol "
success_symbol = "[ ❯](white)"
error_symbol = "[ ❯](white)"
