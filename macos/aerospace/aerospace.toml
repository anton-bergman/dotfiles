# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Multi-Monitor Setup Note:
# If using multiple monitors with Chromium browsers (Chrome, Edge, Brave),
# you may need to disable "Displays have separate Spaces" in System Settings
# to prevent focus conflicts. See: ../settings.md#displays-have-separate-spaces

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=3.0',

  ##### Sketchybar #####
  # Uncomment the next line if you want AeroSpace to start SketchyBar
  #'exec-and-forget sketchybar'
]

##### Sketchybar #####
# Uncomment these lines if you use SketchyBar
# Notify Sketchybar about workspace change
# exec-on-workspace-change = ['/bin/bash', '-c',
#     'sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
# ]
# 
# Notify Sketchybar about focuse change
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# on-focus-changed = [
#   'exec-and-forget sketchybar --trigger aerospace_focus_change',
# ]

##### Simple-bar #####
# Uncomment these lines if you use Simple-Bar
#	on-focus-changed = [
#	  "exec-and-forget osascript -e 'tell application id \"tracesOf.Uebersicht\" to refresh widget id \"simple-bar-index-jsx\"'",
#	]
#	exec-on-workspace-change = [
#	  '/bin/zsh',
#	  '-c',
#	  '/usr/bin/osascript -e "tell application id \"tracesOf.Uebersicht\" to refresh widget id \"simple-bar-index-jsx\""',
#	]

##### Input Source Switching #####
# Automatically switch keyboard input source based on the focused app.
# Terminals and code editors -> English (ABC)
# Browsers -> Swedish-Pro
# All other apps -> no change (keeps current layout)
# Requires: ~/.local/bin/switch-input-source (compiled by install_aerospace.sh)
on-focus-changed = [
    """exec-and-forget /bin/bash -c '
    APP_ID=$(aerospace list-windows --focused --format "%{app-bundle-id}" 2>/dev/null)
    case "$APP_ID" in
        com.mitchellh.ghostty|com.googlecode.iterm2|org.alacritty|net.kovidgoyal.kitty|com.microsoft.VSCode|com.todesktop.230313mzl4w4u92)
            $HOME/.local/bin/switch-input-source com.apple.keylayout.ABC
            ;;
        com.google.Chrome|company.thebrowser.Browser|com.apple.Safari)
            $HOME/.local/bin/switch-input-source com.apple.keylayout.Swedish-Pro
            ;;
    esac
    '"""
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 30

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
default-root-container-orientation = 'horizontal'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 16
    inner.vertical =   16
    outer.left =       16
    outer.bottom =     16
		# Simple-bar
    # outer.top =     [
    #   # offset of 32 on internal display, because of notch (16" MPB)
    #   { monitor.'built-in.*' = 16 },
    #   48
    # ]
		outer.top =				 8
    outer.right =      16

[workspace-to-monitor-force-assignment]
    7 = 'secondary'
    8 = 'secondary'
    9 = 'secondary'

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.main.binding]
    # Leader key to enter Window Management mode
    ctrl-a = 'mode wm'

# 'wm' (Window Management) binding mode declaration
[mode.wm.binding]
    # Safety valves to cancel out of the mode
    esc = 'mode main'
    enter = 'mode main'
    ctrl-a = 'mode main' # Pressing leader again toggles it off

    # Layouts
    slash = ['layout tiles horizontal vertical', 'mode main']
    comma = ['layout accordion horizontal vertical', 'mode main']

    # Focus
    h = ['focus left', 'mode main']
    j = ['focus down', 'mode main']
    k = ['focus up', 'mode main']
    l = ['focus right', 'mode main']

    # Move window
    shift-h = ['move left', 'mode main']
    shift-j = ['move down', 'mode main']
    shift-k = ['move up', 'mode main']
    shift-l = ['move right', 'mode main']

    # Resize
    # Note: You might want to remove 'mode main' from resize if you prefer
    # to hit ctrl-a, then tap minus/equal multiple times before exiting.
    minus = ['resize smart -50']
    equal = ['resize smart +50']

    # Switch workspaces (1-9)
    1 = ['workspace 1', 'mode main']
    2 = ['workspace 2', 'mode main']
    3 = ['workspace 3', 'mode main']
    4 = ['workspace 4', 'mode main']
    5 = ['workspace 5', 'mode main']
    6 = ['workspace 6', 'mode main']
    7 = ['workspace 7', 'mode main']
    8 = ['workspace 8', 'mode main']
    9 = ['workspace 9', 'mode main']

    # Move window to workspace AND follow it
    shift-1 = ['move-node-to-workspace 1', 'workspace 1', 'mode main']
    shift-2 = ['move-node-to-workspace 2', 'workspace 2', 'mode main']
    shift-3 = ['move-node-to-workspace 3', 'workspace 3', 'mode main']
    shift-4 = ['move-node-to-workspace 4', 'workspace 4', 'mode main']
    shift-5 = ['move-node-to-workspace 5', 'workspace 5', 'mode main']
    shift-6 = ['move-node-to-workspace 6', 'workspace 6', 'mode main']
    shift-7 = ['move-node-to-workspace 7', 'workspace 7', 'mode main']
    shift-8 = ['move-node-to-workspace 8', 'workspace 8', 'mode main']
    shift-9 = ['move-node-to-workspace 9', 'workspace 9', 'mode main']

    # Workspace navigation & monitor moving
    tab = ['workspace-back-and-forth', 'mode main']
    shift-tab = ['move-workspace-to-monitor --wrap-around next', 'mode main']

    # Enter service mode from wm mode
    shift-semicolon = 'mode service'

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    f = ['layout floating tiling', 'mode main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']
